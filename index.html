<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>怎么改你都懂</title>
  <style>
    :root{--blue:#0071e3;--blue-hover:#0077ed;--ink:#1d1d1f;--ink-2:#6e6e73;--bg:#f5f5f7;--line:#d2d2d7;--line-soft:#e8e8ed}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--ink);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    .wrap{max-width:680px;margin:0 auto;padding:72px 24px 96px}
    h1{
      font-size:34px;font-weight:700;letter-spacing:-.02em;
      text-align:center;margin-bottom:44px;
    }
    label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:10px}
    textarea{
      width:100%;min-height:132px;
      padding:16px 18px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      font-size:16px;line-height:1.65;
      resize:vertical;outline:none;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
      transition:border-color .2s,box-shadow .2s;
    }
    textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12)}
    textarea::placeholder{color:#a1a1a6}
    .controls{display:flex;align-items:center;gap:18px;margin:26px 0 32px}
    .slider-group{flex:1;display:flex;align-items:center;gap:16px}
    .slider-group .cap{font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
    input[type=range]{
      -webkit-appearance:none;appearance:none;
      flex:1;height:28px;background:transparent;cursor:pointer;
    }
    input[type=range]::-webkit-slider-runnable-track{
      height:6px;border-radius:3px;
      background:linear-gradient(to right,var(--blue) 0%,var(--blue) var(--fill,50%),var(--line) var(--fill,50%),var(--line) 100%);
    }
    input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
      background:#fff;border:1px solid rgba(0,0,0,.08);
      box-shadow:0 2px 8px rgba(0,0,0,.16);
      margin-top:-10px;transition:transform .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08)}
    input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
    input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--blue)}
    input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.16)}
    .slider-val{
      min-width:44px;text-align:center;
      font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
      color:var(--blue);
    }
    button#go{
      padding:12px 30px;border-radius:980px;border:none;
      background:var(--blue);color:#fff;
      font-size:15px;font-weight:600;font-family:inherit;
      cursor:pointer;transition:background .2s,transform .12s,box-shadow .2s;
      box-shadow:0 2px 8px rgba(0,113,227,.28);
      white-space:nowrap;
    }
    button#go:hover{background:var(--blue-hover)}
    button#go:active{transform:scale(.97)}
    .out-card{
      background:#fff;border:1px solid var(--line-soft);border-radius:16px;
      padding:22px 22px 18px;min-height:92px;
      white-space:pre-wrap;font-size:16px;line-height:1.7;
      position:relative;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
    }
    .copy-btn{
      position:absolute;top:14px;right:14px;
      background:#fff;border:1px solid var(--line);border-radius:980px;
      color:var(--blue);padding:5px 14px;
      font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;
      transition:background .15s,border-color .15s;
    }
    .copy-btn:hover{background:var(--bg);border-color:var(--blue)}
  </style>
</head>
<body>
<div class="wrap">
  <h1>怎么改你都懂</h1>

  <label for="src">输入原文</label>
  <textarea id="src" placeholder="在这里输入你想改写的中文句子，比如：&#10;这个方案真的太厉害了，我们明天下午三点开会讨论一下吧，拜拜！"></textarea>

  <div class="controls">
    <div class="slider-group">
      <span class="cap">改写强度</span>
      <input id="strength" type="range" min="1" max="10" value="6" />
      <span class="slider-val" id="sval">6</span>
    </div>
    <button id="go">改写一下</button>
  </div>

  <label>改写结果</label>
  <div class="out-card" id="out">
    <button class="copy-btn" id="copy">复制</button>
    <span id="outtext">点「改写一下」看看效果 ✨</span>
  </div>
</div>

<script>
// ====== 同音/错别字表（正常词 → 谐音/错字写法） ======
const HOMOPHONE_MAP=[
  ["政府","振府"],["检查","捡查"],["监控","见控"],["敏感","感敏"],["审查","审察"],
  ["政治","政制"],["民主","皿主"],["自由","自游"],["人权","仁权"],["改革","改格"],
  ["抗议","看异"],["示威","市威"],["游行","由行"],["请愿","晴愿"],["罢工","八工"],
  ["革命","个命"],["独裁","读裁"],["腐败","付败"],["贪污","谈物"],["压迫","呀迫"],
  ["镇压","阵呀"],["逮捕","带捕"],["拘留","居留"],["封锁","风锁"],["删帖","山帖"],
  ["封号","风号"],["禁言","尽言"],["限流","线流"],["屏蔽","瓶避"],["过滤","国虑"],
  ["举报","菊报"],["实名","十名"],["追踪","追宗"],["维稳","为稳"],
  ["上访","上方"],["维权","为权"],["强拆","墙拆"],["征地","争地"],["城管","成管"],
  ["黑社会","嘿社会"],["打黑","大嘿"],["黄赌毒","黄读毒"],["色情","涩情"],
  ["赌博","读博"],["毒品","独品"],["走私","走丝"],["洗钱","西钱"],
  ["逃税","桃税"],["造假","早假"],["盗版","到版"],["破解","破姐"],
  ["翻墙","帆墙"],["加密","加蜜"],["解密","姐蜜"],
  ["黑客","嘿客"],["病毒","丙毒"],["木马","木蚂"],["钓鱼","掉鱼"],["诈骗","炸骗"],
  ["传销","穿销"],["非法","飞法"],["违法","违发"],["犯罪","饭最"],["判刑","盼行"],
  ["死刑","四刑"],["无期","五期"],["枪毙","墙必"],["越狱","月狱"],["暴动","报动"],
  ["恐怖","空步"],["炸弹","炸蛋"],["枪击","墙击"],["绑架","绑假"],
  ["人质","仁质"],["屠杀","图杀"],["酷刑","哭行"],["虐待","女待"],
];

// ====== 数字梗表（正常词 → 数字暗语，中国人一看就懂） ======
const NUM_SLANG=[
  ["厉害","666"],["很溜","666"],["拜拜","88"],["我爱你","520"],["一生一世","1314"],
  ["呜呜呜","555"],["气死我了","7456"],["救救我","995"],["谢谢","3Q"],["傻瓜","62"],
];

// ====== 字母/拼音混写表（正常词 → 拼音混写） ======
const MIX_MAP=[
  ["牛逼","niúB"],["厉害","lì害"],["绝了","jue了"],["太强","tai强"],
  ["nb","niuB"],["yyds","永远滴神"],["草","cǎo"],["卧槽","我cào"],
  ["太棒","tai棒"],["服了","fu了"],["牛","Niu"],["无语","wú语"],
  ["我靠","我kao"],["搞笑","gao笑"],["离谱","lí谱"],["崩溃","bēng溃"],
  ["炸裂","炸liè"],["上头","上tóu"],["硬核","yìng核"],["顶级","顶jí"],
];

// ====== 工具函数 ======
function rand(n){return Math.floor(Math.random()*n)}
function flipTwo(s){if(s.length<2)return s;const i=rand(s.length-1);return s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2)}
function maybeFlip(seg,p){
  if(!/^[\u4e00-\u9fff]{2,5}$/.test(seg))return seg;
  if(Math.random()>p)return seg;
  if(seg.length===2)return Math.random()<.7?seg[1]+seg[0]:seg;
  return flipTwo(seg);
}

// 通用：按词表逐条替换（每条约按概率生效，只替换第一次出现）
function applyMap(t,map,prob){
  let o=t;
  for(const[f,r]of map){
    if(o.includes(f)&&Math.random()<prob)o=o.replace(f,r);
  }
  return o;
}
// strength 为 1~10，归一化后按比例生效
function applyHom(t,s){return applyMap(t,HOMOPHONE_MAP,s*0.09)}
function applyNum(t){return applyMap(t,NUM_SLANG,1)}
function applyMix(t,s){return applyMap(t,MIX_MAP,s*0.06)}
function applyFlip(t,s){
  const p=s*0.075;
  return t.replace(/[\u4e00-\u9fff]{2,5}/g,m=>maybeFlip(m,p));
}
function transform(src,strength){
  let t=src;
  t=applyNum(t);        // 先处理数字梗，优先把 厉害→666 这类替换掉
  t=applyHom(t,strength);
  t=applyMix(t,strength);
  t=applyFlip(t,strength);
  return t;
}

// ====== UI ======
const $=id=>document.getElementById(id);
const slider=$("strength"),sval=$("sval");
function paintSlider(){
  const v=parseInt(slider.value);
  sval.textContent=v;
  slider.style.setProperty("--fill",((v-1)/9*100)+"%");
}
slider.oninput=paintSlider;
paintSlider();

$("go").onclick=()=>{
  const src=$("src").value.trim();
  if(!src){$("outtext").textContent="请先输入一些文字 :)";return}
  $("outtext").textContent=transform(src,parseInt(slider.value));
};

$("copy").onclick=()=>{
  const t=$("outtext").textContent;if(!t)return;
  navigator.clipboard.writeText(t).then(()=>{$("copy").textContent="已复制 ✓";setTimeout(()=>$("copy").textContent="复制",1200)});
};
</script>
</body>
</html>
